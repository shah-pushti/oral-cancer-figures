name: Rebuild figures

on:
  push:
    branches: [main]
    paths: ["data/**", "notebooks/**", "requirements.txt", ".github/workflows/rebuild-figures.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Run every notebook
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --inplace "$nb"
          done
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks figures
          git diff --cached --quiet || git commit -m "Rebuild figures and notebook outputs from data"
          git push
